<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>LiftLog</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--muted:#8e8e93;--line:#e5e5ea;--blue:#007aff;--green:#34c759}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:100px}
.nav{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 10px) 18px 12px;background:rgba(242,242,247,.92);backdrop-filter:blur(22px);border-bottom:1px solid #d1d1d6}
.navrow{display:flex;align-items:center;justify-content:space-between}.title{font-size:34px;font-weight:700;letter-spacing:-1.2px}.count{color:var(--muted);font-size:14px;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--blue);color:white;font-size:26px;line-height:42px}
.content{padding:18px}
.sectiontitle{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600;margin:0 4px 8px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px #00000008;margin-bottom:18px}
.exerciseHead{display:flex;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}
.name{font-size:18px;font-weight:650;flex:1}.remove{border:0;background:#f2f2f7;color:#ff3b30;border-radius:50%;width:30px;height:30px;font-size:18px}
.history{display:flex;overflow-x:auto;padding:14px 12px 16px;gap:10px;scrollbar-width:none}.history::-webkit-scrollbar{display:none}
.entry{flex:0 0 108px;background:#f2f2f7;border-radius:14px;padding:11px 8px;text-align:center}.entry .num{font-size:11px;color:var(--muted);margin-bottom:5px}.entry input{width:100%;border:0;background:transparent;text-align:center;font-size:16px;font-weight:600;outline:none;color:var(--text)}
.entry.latest{background:#e8f2ff}.entry.latest .num{color:var(--blue)}
.addEntry{flex:0 0 108px;border:1px dashed #c7c7cc;border-radius:14px;background:transparent;color:var(--blue);font-size:15px;font-weight:600}
.fab{position:fixed;z-index:20;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);left:20px;max-width:720px;margin:auto;height:54px;border:0;border-radius:17px;background:var(--blue);color:white;font-size:17px;font-weight:650;box-shadow:0 7px 22px #007aff45}
.empty{text-align:center;padding:65px 20px;color:var(--muted)}.emptyIcon{font-size:46px;margin-bottom:12px}.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:5px}
.modal{display:none;position:fixed;inset:0;z-index:50;background:#0006;align-items:flex-end}.sheet{width:100%;background:#f2f2f7;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}.grab{width:38px;height:5px;border-radius:5px;background:#c7c7cc;margin:0 auto 20px}
.sheet h2{margin:0 0 14px;font-size:22px}.sheet input{width:100%;padding:15px;border:0;border-radius:13px;background:#fff;font-size:17px;outline:0}.sheet .primary{width:100%;margin-top:12px;height:50px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-size:17px;font-weight:650}.cancel{width:100%;border:0;background:none;color:var(--blue);font-size:16px;padding:15px}
</style>
</head>
<body>
<div class="app">
<header class="nav"><div class="navrow"><div><div class="title">LiftLog</div><div class="count" id="count"></div></div><button class="iconbtn" onclick="openExercise()">＋</button></div></header>
<main class="content" id="app"></main>
<button class="fab" onclick="addWorkout()">＋ Log New Workout</button>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="grab"></div><h2>Add Exercise</h2><input id="exerciseInput" placeholder="e.g. Bench Press" autocomplete="off"><button class="primary" onclick="createExercise()">Add Exercise</button><button class="cancel" onclick="closeModal()">Cancel</button></div></div>
<script>
const KEY="liftlogV2";let data=JSON.parse(localStorage.getItem(KEY)||'{"workouts":0,"exercises":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function openExercise(){modal.style.display="flex";setTimeout(()=>exerciseInput.focus(),100)}
function closeModal(){modal.style.display="none";exerciseInput.value=""}
function createExercise(){let n=exerciseInput.value.trim();if(!n)return;data.exercises.push({name:n,entries:Array(data.workouts).fill("")});save();closeModal()}
function addWorkout(){data.workouts++;data.exercises.forEach(e=>e.entries.push(""));save();setTimeout(()=>{document.querySelectorAll(".history").forEach(x=>x.scrollLeft=x.scrollWidth)},50)}
function setEntry(i,j,v){data.exercises[i].entries[j]=v;localStorage.setItem(KEY,JSON.stringify(data))}
function removeExercise(i){if(confirm("Remove "+data.exercises[i].name+"?")){data.exercises.splice(i,1);save()}}
function render(){
count.textContent=data.exercises.length+(data.exercises.length===1?" exercise":" exercises");
if(!data.exercises.length){app.innerHTML='<div class="empty"><div class="emptyIcon">🏋️</div><b>Your workout log is empty</b><span>Add an exercise to start tracking your progress.</span></div>';return}
let h='<div class="sectiontitle">Progress</div>';
data.exercises.forEach((e,i)=>{h+=`<section class="card"><div class="exerciseHead"><div class="name">${esc(e.name)}</div><button class="remove" onclick="removeExercise(${i})">−</button></div><div class="history">`;
if(!data.workouts)h+='<div style="padding:8px;color:#8e8e93">No workouts logged yet.</div>';
for(let j=0;j<data.workouts;j++)h+=`<div class="entry ${j===data.workouts-1?'latest':''}"><div class="num">Workout ${j+1}</div><input inputmode="text" placeholder="135 × 10" value="${esc(e.entries[j]||"")}" onchange="setEntry(${i},${j},this.value)"></div>`;
h+=`<button class="addEntry" onclick="addWorkout()">＋ Log</button></div></section>`});app.innerHTML=h}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
exerciseInput.addEventListener("keydown",e=>{if(e.key==="Enter")createExercise()});render();
</script>
</body></html>
