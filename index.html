<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.json">
<title>LiftLog</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:900px;margin:auto;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}
header{padding:18px 4px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#f2f2f7cc;backdrop-filter:blur(12px);z-index:3}
h1{font-size:30px;margin:0;font-weight:750}.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:650;background:#007aff;color:white}.btn.secondary{background:#e5e5ea;color:#111}
.card{background:#fff;border-radius:18px;margin:12px 0;padding:14px;box-shadow:0 1px 3px #00000012}
.cardtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.name{font-size:19px;font-weight:700}.delete{border:0;background:transparent;color:#ff3b30;font-size:14px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}.grid{display:grid;grid-auto-flow:column;grid-auto-columns:116px;gap:8px;min-width:max-content}.cell{height:76px;border:1px solid #d1d1d6;border-radius:13px;background:#f8f8fa;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px}.cell.latest{border:2px solid #007aff}.cell.empty{color:#8e8e93;font-weight:500}.wlabel{font-size:11px;color:#8e8e93;margin-bottom:4px}.emptyState{text-align:center;padding:42px 20px;color:#6e6e73}
.overlay{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}.sheet{background:#f2f2f7;width:100%;border-radius:22px 22px 0 0;padding:18px max(18px,calc((100% - 600px)/2)) calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{margin:0 0 16px}.field{background:#fff;border-radius:14px;padding:12px;margin:9px 0}.field label{display:block;color:#6e6e73;font-size:12px;margin-bottom:6px}.field input{width:100%;border:0;outline:0;font-size:19px;background:transparent}.step{display:flex;align-items:center;gap:10px}.step button{width:48px;height:44px;border:0;border-radius:12px;background:#e5e5ea;font-size:25px}.step input{text-align:center}.sheetActions{display:flex;gap:10px;margin-top:14px}.sheetActions .btn{flex:1}.danger{background:#ff3b30!important}
#workoutsBar{display:flex;gap:8px;overflow:auto;padding:3px 2px 8px}.pill{white-space:nowrap;background:#e5e5ea;border:0;border-radius:20px;padding:8px 12px}.pill.active{background:#007aff;color:white}
.group{margin:14px 0}.grouphead{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:16px;background:#fff;padding:14px 16px;font-size:18px;font-weight:750;text-align:left}.groupbody.collapsed{display:none}.tiny{border:0;border-radius:10px;padding:7px 10px;background:#e5e5ea;font-size:12px}.exercisegroup{font-size:12px;color:#8e8e93;margin-top:3px}.migrate{background:#fff7d6;border-radius:14px;padding:12px;margin:8px 0;font-size:14px;display:none}.migrate button{margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header><h1>LiftLog</h1><div class="actions"><button class="btn secondary" onclick="manageGroups()">Groups</button><button onclick="backup()">Backup</button><button onclick="document.getElementById('restoreFile').click()">Restore</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restore(event)"><button class="btn secondary" onclick="addExercise()">+ Exercise</button><button class="btn" onclick="addWorkout()">+ Workout</button></div></header>
<div id="migrationNotice" class="migrate"></div>
<div id="workoutsBar"></div><main id="list"></main>
<div id="empty" class="emptyState">Add an exercise to get started.</div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
<div class="sheet">
<h2 id="sheetTitle">Workout</h2>
<div class="field"><label>Load / Weight</label><div class="step"><button onclick="stepWeight(-1)">−</button><input id="load" placeholder="135, Red, Bodyweight"><button onclick="stepWeight(1)">+</button></div></div>
<div class="field"><label>Reps</label><div class="step"><button onclick="stepReps(-1)">−</button><input id="reps" inputmode="numeric" placeholder="10"><button onclick="stepReps(1)">+</button></div></div>
<div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveEntry()">Save</button></div>
<button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteCurrentEntry()">Delete This Lift Entry</button>
<button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteCurrentWorkout()">Delete Entire Workout</button>
</div></div>
<script>
const KEY="liftlogV3";
let data=JSON.parse(localStorage.getItem(KEY)||'{"workouts":0,"exercises":[],"groups":[]}');
if(!Array.isArray(data.groups))data.groups=[]; data.exercises.forEach(e=>{if(typeof e.group!=="string")e.group=""});
let current={ei:0,wi:0};

function normalizeOld(old){
  // Supports the prior LiftLog data shape: {workouts, exercises:[{name, entries:[]}]}
  if(!old || !Array.isArray(old.exercises)) return null;
  let workouts=Number(old.workouts)||0;
  let exercises=old.exercises.map(e=>({name:String(e.name||"Exercise"),entries:Array.isArray(e.entries)?e.entries.map(x=>x==null?"":String(x)):[]}));
  workouts=Math.max(workouts,...exercises.map(e=>e.entries.length),0);
  exercises.forEach(e=>{while(e.entries.length<workouts)e.entries.push("")});
  return {workouts,exercises};
}
function migrate(){
  if(localStorage.getItem(KEY)) return;
  const candidates=["liftlogV2","liftlog","workoutTracker","workoutData"];
  for(const k of candidates){
    try{
      const old=JSON.parse(localStorage.getItem(k)||"null");
      const n=normalizeOld(old);
      if(n && (n.exercises.length||n.workouts)){data=n;localStorage.setItem(KEY,JSON.stringify(data));return k}
    }catch(e){}
  }
  return null;
}
const migratedFrom=migrate();

function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function addExercise(){
 let n=prompt("Exercise name"); if(!n||!n.trim())return;
 data.exercises.push({name:n.trim(),group:"",entries:Array(data.workouts).fill("")}); save();
}
function addWorkout(){data.workouts++;data.exercises.forEach(e=>e.entries.push(""));save();current.wi=data.workouts-1}
function removeExercise(i){if(confirm("Delete "+data.exercises[i].name+"?")){data.exercises.splice(i,1);save()}}
function parse(v){let m=(v||"").split(/[×x]/);return{load:(m[0]||"").trim(),reps:(m[1]||"").trim()}}
function openEntry(ei,wi){
 current={ei,wi};let p=parse(data.exercises[ei].entries[wi]||"");
 document.getElementById("sheetTitle").textContent=data.exercises[ei].name+" • Workout "+(wi+1);
 document.getElementById("load").value=p.load;document.getElementById("reps").value=p.reps;
 document.getElementById("overlay").style.display="flex";
}
function closeSheet(){document.getElementById("overlay").style.display="none"}
function saveEntry(){
 let load=document.getElementById("load").value.trim(),reps=document.getElementById("reps").value.trim();
 data.exercises[current.ei].entries[current.wi]=load?(reps?load+" × "+reps:load):"";
 closeSheet();save();
}
function stepWeight(d){
 let el=document.getElementById("load"),v=el.value.trim(),m=v.match(/^(-?\d+(?:\.\d+)?)(.*)$/);if(!m)return;
 let num=parseFloat(m[1])+d*2.5;el.value=(Number.isInteger(num)?num:num.toFixed(1))+m[2];
}
function stepReps(d){let el=document.getElementById("reps"),n=parseInt(el.value||"0",10)+d;el.value=Math.max(0,n)}
function deleteCurrentEntry(){
 if(!data.exercises[current.ei]) return;
 const lift=data.exercises[current.ei].name;
 if(!confirm("Delete this entry for "+lift+" in Workout "+(current.wi+1)+"?")) return;
 data.exercises[current.ei].entries[current.wi]="";
 closeSheet();
 save();
}
function deleteCurrentWorkout(){
 if(!data.workouts)return;
 if(!confirm("Delete Workout "+(current.wi+1)+" for every exercise?"))return;
 data.workouts--;data.exercises.forEach(e=>e.entries.splice(current.wi,1));
 closeSheet();current.wi=Math.max(0,data.workouts-1);save();
}

function manageGroups(){
 let choice=prompt("Type one of these commands:\nADD Kettlebell Workouts\nRENAME Old Name|New Name\nDELETE Group Name");
 if(!choice)return;
 let a=choice.split("|"), c=a[0].trim(), u=c.toUpperCase();
 if(u.startsWith("ADD ")){let n=c.slice(4).trim();if(n&&!data.groups.some(g=>g.name.toLowerCase()==n.toLowerCase()))data.groups.push({name:n,collapsed:false});}
 else if(u.startsWith("RENAME ")&&a[1]){let old=c.slice(7).trim(),n=a[1].trim(),g=data.groups.find(x=>x.name.toLowerCase()==old.toLowerCase());if(g&&n){g.name=n;data.exercises.forEach(e=>{if(e.group==old)e.group=n})}}
 else if(u.startsWith("DELETE ")){let n=c.slice(7).trim();if(confirm("Delete this group? Exercises will become Ungrouped.")){data.groups=data.groups.filter(g=>g.name.toLowerCase()!=n.toLowerCase());data.exercises.forEach(e=>{if(e.group.toLowerCase()==n.toLowerCase())e.group=""})}}
 save();
}
function changeExerciseGroup(i){
 let opts=["Ungrouped"].concat(data.groups.map(g=>g.name));
 let n=parseInt(prompt("Move "+data.exercises[i].name+" to group:\n"+opts.map((x,j)=>(j+1)+". "+x).join("\n")),10);
 if(n>=1&&n<=opts.length){data.exercises[i].group=n==1?"":opts[n-1];save()}
}
function toggleGroup(name){
 let g=data.groups.find(x=>x.name==name);if(g){g.collapsed=!g.collapsed;save()}
}

function render(){
 let list=document.getElementById("list"),bar=document.getElementById("workoutsBar"),empty=document.getElementById("empty");
 bar.innerHTML=""; for(let w=0;w<data.workouts;w++){let b=document.createElement("button");b.className="pill"+(w==data.workouts-1?" active":"");b.textContent="Workout "+(w+1);b.onclick=()=>{current.wi=w;document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));b.classList.add("active")};bar.appendChild(b)}
 list.innerHTML="";empty.style.display=data.exercises.length?"none":"block";
 function card(e,i){
  let c=document.createElement("section");c.className="card";
  let t=document.createElement("div");t.className="cardtop";t.innerHTML='<div><div class="name"></div><div class="exercisegroup"></div></div><button class="delete">Delete</button>';
  t.querySelector(".name").textContent=e.name;t.querySelector(".exercisegroup").textContent=e.group?"Group: "+e.group:"Ungrouped";t.querySelector(".delete").onclick=()=>removeExercise(i);c.appendChild(t);
  let cg=document.createElement("button");cg.className="tiny";cg.textContent="Change Group";cg.onclick=()=>changeExerciseGroup(i);c.appendChild(cg);
  let sc=document.createElement("div");sc.className="scroller";let g=document.createElement("div");g.className="grid";
  for(let w=0;w<data.workouts;w++){let cell=document.createElement("button");cell.className="cell"+(w==data.workouts-1?" latest":"")+(e.entries[w]?"":" empty");cell.innerHTML='<div class="wlabel">Workout '+(w+1)+'</div>';let v=document.createElement("div");v.textContent=e.entries[w]||"Tap to enter";cell.appendChild(v);cell.onclick=()=>openEntry(i,w);g.appendChild(cell)}
  sc.appendChild(g);c.appendChild(sc);return c;
 }
 let names=data.groups.map(g=>g.name), used={};
 names.forEach(n=>used[n]=[]);
 data.exercises.forEach((e,i)=>{if(e.group&&used[e.group])used[e.group].push([e,i]);});
 names.forEach(n=>{
  let g=data.groups.find(x=>x.name==n),sec=document.createElement("div");sec.className="group";
  let h=document.createElement("button");h.className="grouphead";h.innerHTML='<span><span class="arrow">'+(g.collapsed?"▶":"▼")+'</span> '+n+' ('+used[n].length+')</span>';h.onclick=()=>toggleGroup(n);sec.appendChild(h);
  let body=document.createElement("div");body.className="groupbody"+(g.collapsed?" collapsed":"");
  used[n].forEach(([e,i])=>body.appendChild(card(e,i)));sec.appendChild(body);list.appendChild(sec);
 });
 let un=data.exercises.map((e,i)=>[e,i]).filter(([e])=>!e.group);
 if(un.length){let sec=document.createElement("div");sec.className="group";let h=document.createElement("button");h.className="grouphead";h.innerHTML='<span>▼ Ungrouped ('+un.length+')</span>';sec.appendChild(h);let body=document.createElement("div");un.forEach(([e,i])=>body.appendChild(card(e,i)));sec.appendChild(body);list.appendChild(sec);}
}
if(migratedFrom){const n=document.getElementById("migrationNotice");n.style.display="block";n.innerHTML="Your existing workout data was imported from the previous version. <button class='btn secondary' onclick='this.parentElement.style.display=\"none\"'>OK</button>"}
render();

function backup(){
  try{
    const payload={app:"LiftLog",version:6,exportedAt:new Date().toISOString(),data:data};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="LiftLog-backup.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){ alert("Backup could not be created."); }
}
function restore(ev){
  const f=ev.target.files && ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const p=JSON.parse(r.result);
      const restored=p.data || p;
      if(!restored || !Array.isArray(restored.exercises)) throw new Error("Invalid backup");
      if(!confirm("Restore this backup? This replaces the current LiftLog data.")) return;
      data=restored;
      if(!Array.isArray(data.groups)) data.groups=[];
      localStorage.setItem(typeof KEY!=="undefined"?KEY:"liftlogV6",JSON.stringify(data));
      if(typeof render==="function") render();
      alert("Backup restored successfully.");
    }catch(e){ alert("That backup file could not be restored."); }
    finally{ ev.target.value=""; }
  };
  r.readAsText(f);
}

</script>
</body></html>
